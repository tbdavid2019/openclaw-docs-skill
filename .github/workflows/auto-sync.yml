name: Auto-Sync Documentation

on:
  schedule:
    # Runs at 04:00 UTC every day
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

permissions:
  contents: write

concurrency:
  group: auto-sync-documentation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Repository Tests
        run: python3 -m unittest -v tests/test_repo.py

      - name: Run Sync Script
        run: sh scripts/sync-docs.sh

      - name: Validate Synchronized Artifacts
        run: |
          python3 scripts/generate_index.py --check
          test -s references/SOURCE.json
          test -s references/SKILL_INDEX.md

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync documentation and regenerate index"
          file_pattern: 'references/**'
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
